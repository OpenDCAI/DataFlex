### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 8

### dataset
dataset: mmfinereason_sft_demo
template: qwen2_vl
cutoff_len: 16384  # vision tokens budget.
# max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 0
# disable_shuffling: true
seed: 42

### output
output_dir: ../dataflex_saves/Qwen2.5-VL-7B/coincide
logging_steps: 10
save_steps: 100
plot_loss: true
save_only_model: false
overwrite_output_dir: true

### swanlab
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: qwen25vl7b_coincide_lora_123k_3epoch

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### dynamic_train
train_type: dynamic_select
components_cfg_file: src/dataflex/configs/components.yaml
component_name: coincide
warmup_step: 10
update_step: 240  
update_times: 2

## eval
eval_dataset: mmfinereason_eval_demo
per_device_eval_batch_size: 1
metric_for_best_model: eval_loss
greater_is_better: false
load_best_model_at_end: false
eval_strategy: steps    # choices: [no, steps, epoch]
eval_steps: 10

# FORCE_TORCHRUN=1 DISABLE_VERSION_CHECK=1 dataflex-cli train examples/train_lora/selectors/coincide.yaml
