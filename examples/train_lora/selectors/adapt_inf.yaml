# LLaVA-1.5 stage1 development run on image-only LLaVA data.
# Merge Vicuna + pretrained projector + CLIP-336 first; override local paths.
model_name_or_path: models/llava-v1.5-7b-stage1-hf
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
additional_target: multi_modal_projector
freeze_multi_modal_projector: false
freeze_vision_tower: true
lora_rank: 8
lora_alpha: 16
dataset: llava620k
dataset_dir: data
template: llava
cutoff_len: 2048
packing: false
preprocessing_num_workers: 1
dataloader_num_workers: 0
output_dir: ../dataflex_saves/adapt_inf_smoke
logging_steps: 1
save_steps: 10
overwrite_output_dir: false
report_to: none
seed: 42
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
num_train_epochs: 1.0
bf16: true
gradient_checkpointing: false
train_type: dynamic_select
components_cfg_file: src/dataflex/configs/components.yaml
component_name: adapt_inf
warmup_step: 4
update_step: 8
update_times: 2
train_step: 20
