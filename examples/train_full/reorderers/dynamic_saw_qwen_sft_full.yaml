### model
model_name_or_path: Qwen/Qwen3-1.7B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
# 动态排序不需要原始数据带分数字段：分数由当前模型在线算出来。
dataset: alpaca_en_demo
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
seed: 42
val_size: 0
packing: false

### output
output_dir: ../dataflex_saves/Qwen3-1.7B/reorder_dynamic_saw
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Dataflex args
train_type: dynamic_reorder
components_cfg_file: src/dataflex/configs/components.yaml
component_name: dynamic_saw
warmup_step: 10
update_step: 50              # 每 50 步用当前模型重新给剩余样本打分并重排
update_times: 20

# 开销提醒：每个 update 间隔要对样本池做一次前向。用 components.yaml 里的
# score_params.max_samples 限制打分规模，或调大 reorder_every 降低打分频率。
