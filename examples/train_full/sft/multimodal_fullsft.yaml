### model
model_name_or_path: /jizhicfs/rtliu/models/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: mmfinereason_sft
template: qwen2_vl
cutoff_len: 16384
overwrite_cache: false
preprocessing_num_workers: 16
dataloader_num_workers: 0
seed: 42

### output
output_dir: ../dataflex_saves/Qwen2.5-VL-7B/sft_full
logging_steps: 10
save_steps: 50
plot_loss: true
save_only_model: false
overwrite_output_dir: true

### tracking
report_to: wandb
run_name: qwen25vl7b_sft_full_123k_3epoch

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: mmfinereason_eval
per_device_eval_batch_size: 1
metric_for_best_model: eval_loss
greater_is_better: false
load_best_model_at_end: false
eval_strategy: steps
eval_steps: 50
